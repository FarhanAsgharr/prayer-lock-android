name: prayer_lock
description: "Prayer Lock AI — pray on time, with fewer distractions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Localisation delegates for Material, Cupertino and Widgets. Required for
  # Arabic and Urdu: without these the framework's own strings (date pickers,
  # dialog buttons, semantics labels) stay English and text direction is not
  # resolved from the locale.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. Riverpod over Provider/Bloc because prayer state is
  # heavily derived (next prayer, countdown, streak all fall out of one
  # schedule) and Riverpod's computed providers express that directly.
  flutter_riverpod: ^2.6.1

  # Declarative routing, so deep links from notifications resolve to the right
  # screen without imperative navigation from a background isolate.
  go_router: ^14.6.2

  # Timezone database. Dart's core library has no IANA support, and prayer
  # times are meaningless without correct local offsets across DST.
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Formatting of dates and numbers, locale-aware.
  intl: ^0.20.2

  # Local notifications, including the exact-alarm scheduling that prayer
  # reminders require.
  flutter_local_notifications: ^18.0.1

  # Location for automatic prayer-time detection.
  geolocator: ^13.0.2

  # Camera for prayer verification.
  camera: ^0.12.0

  # Adhan playback.
  audioplayers: ^6.1.0

  # Local persistence. sqflite for structured prayer history, secure storage
  # for tokens — tokens must never sit in a plain database file.
  # SQLCipher-backed sqflite. Prayer history reveals religious practice and
  # daily routine, so it is encrypted at rest rather than stored in a plain
  # database file readable by anyone with device access.
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Network client with interceptor support for auth refresh and retries.
  dio: ^5.7.0

  # Offline detection, so the sync queue knows when to drain.
  connectivity_plus: ^6.1.0

  # Runtime permission requests (camera, location, notifications).
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end tests. Runs the real app against a real engine, so it exercises
  # the paths unit tests cannot: the router, the encrypted database, the
  # platform channels, and app restart.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # Generates the Android launcher icons — every density plus the adaptive
  # foreground/background layers — from a single source PNG. Regenerating by
  # hand across five density buckets is exactly the kind of job that silently
  # leaves one bucket stale.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb. See l10n.yaml.
  generate: true

  assets:
    - assets/audio/
    - assets/branding/

# Launcher icon generation. Run after changing the source art:
#
#   flutter pub run flutter_launcher_icons
#
# The source must be the *badge only* — square, no wordmark. Text is illegible
# at 48dp and Play's icon guidelines discourage it, so the logo's "PRAYER LOCK"
# lockup belongs on the store listing and the splash screen, not here.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png

  # Adaptive icon for Android 8+. The launcher may crop the foreground to a
  # circle, squircle or rounded square depending on the device, and only the
  # centre ~66% is guaranteed visible — so the foreground art needs generous
  # padding or the minarets get clipped.
  # Brand green, not white: the foreground mark is white, so a white
  # background would make it vanish in adaptive and themed launchers.
  adaptive_icon_background: "#1B5E4A"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

  # Android 13+ themed icon: the launcher tints a monochrome layer to match the
  # user's wallpaper. Without it, the icon ignores themed-icon mode and looks
  # out of place next to every other app on the home screen.
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png

  min_sdk_android: 24
